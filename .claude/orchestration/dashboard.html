<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run console</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --panel-2: #f8f9fb; --ink: #17202a; --ink-2: #3d4753; --muted: #6b7684;
  --line: #e1e5ea; --line-2: #eef1f4; --accent: #2f6fdb; --accent-ink: #ffffff;
  --ok: #1e8a4c; --warn: #b26b00; --bad: #c0392b; --info: #2f6fdb;
  --ok-bg: #e7f5ec; --warn-bg: #fdf3e2; --bad-bg: #fbeaea; --info-bg: #e9f0fc;
  --code: #f1f3f6; --shadow: 0 1px 2px rgba(20, 30, 40, .06), 0 2px 8px rgba(20, 30, 40, .04);
  --g-waiting: #8792a2; --g-ready: #56627a; --g-idle: #aab3bf; --g-running: #2f6fdb; --g-parked: #b26b00;
  --g-check: #7b4fd6; --g-review: #0f8a8a; --g-fix: #d0661e; --g-train: #1e8a4c; --g-planner: #c0392b; --g-done: #9aa5b1;
  /* the charts' colours, each validated (the dataviz skill's validate_palette.js, against the panel): the categorical
     slots in their fixed order; the shared chain's material parts an ordinal blue ramp, its bottom darkest; status apart */
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7;
  --r1: #104281; --r2: #1c5cab; --r3: #2a78d6; --r4: #5598e7; --r5: #86b6ef; --r-ink1: #fff; --r-ink5: #0b0b0b;
  --st-warn: #fab219; --st-serious: #ec835a; --grid: #e6e8ec; --axis: #c3c2b7;
  --c-read: var(--s1); --c-write: var(--s2); --c-input: var(--s3); --c-output: var(--s4); --c-pings: var(--s5); --c-loads: var(--s6);
  --p-reasoning: var(--s6); --p-delta: var(--s2); --p-role: var(--s3); --p-kb: var(--s4); --p-churn: var(--s7);
  --t-model: var(--s1); --t-tools: var(--s2); --t-idle: #a7a6a0;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1216; --panel: #171b21; --panel-2: #1c2129; --ink: #e6eaef; --ink-2: #c3cad3; --muted: #8e99a7;
          --line: #2a313b; --line-2: #222831; --accent: #6ea0ff; --accent-ink: #0f1216;
          --ok: #4cc27f; --warn: #e3a646; --bad: #ff6f5f; --info: #6ea0ff;
          --ok-bg: #16281e; --warn-bg: #2d2413; --bad-bg: #2f1a18; --info-bg: #182338;
          --code: #1f252e; --shadow: none;
          --g-waiting: #8792a2; --g-ready: #9aa6b8; --g-idle: #6b7582; --g-running: #6ea0ff; --g-parked: #e3a646;
          --g-check: #a88af0; --g-review: #3cc0c0; --g-fix: #f08a45; --g-train: #4cc27f; --g-planner: #ff6f5f; --g-done: #5f6b78;
          --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9;
          --r1: #184f95; --r2: #256abf; --r3: #3987e5; --r4: #6da7ec; --r5: #b7d3f6; --r-ink1: #fff; --r-ink5: #0b0b0b;
          --grid: #262c35; --axis: #383d45; --t-idle: #6b6a66; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
code, pre, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
a { color: var(--accent); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }

/* the frame */
header.top { position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 16px; padding: 10px 20px; max-width: 1640px; margin: 0 auto; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 15px; letter-spacing: .01em; white-space: nowrap; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.updated { color: var(--muted); font-size: 12px; white-space: nowrap; display: flex; gap: 8px; align-items: center; }
.updated.paused #updated { color: var(--warn); }
.jump { margin-left: auto; position: relative; display: flex; align-items: center; }
.jump input { width: 230px; padding-right: 26px; }
.jump kbd, kbd { font: 11px ui-monospace, Menlo, monospace; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; background: var(--panel-2); }
.jump kbd { position: absolute; right: 7px; pointer-events: none; }
nav.tabs { display: flex; gap: 2px; padding: 0 20px; max-width: 1640px; margin: 0 auto; overflow-x: auto; }
nav.tabs .sep { width: 1px; background: var(--line); margin: 8px 8px; }
nav.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 9px 12px;
                  font: inherit; font-weight: 500; cursor: pointer; white-space: nowrap; }
nav.tabs button:hover { color: var(--ink); }
nav.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs .count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 9px; font-size: 11px;
                  line-height: 18px; background: var(--bad); color: #fff; text-align: center; }
main { max-width: 1640px; margin: 0 auto; padding: 18px 20px 60px; }
main.loading { opacity: .5; transition: opacity .12s .08s; pointer-events: none; }  /* a click taken, its view coming */

/* building blocks */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); min-width: 0; }
.panel > .head { display: flex; align-items: baseline; gap: 10px; padding: 12px 16px 8px; flex-wrap: wrap; }
.panel > .head h2 { margin: 0; font-size: 14px; font-weight: 650; }
.panel > .head .sub { color: var(--muted); font-size: 12px; }
.panel > .head .actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.panel > .body { padding: 4px 16px 14px; }
.panel > .body.flush { padding: 0 0 6px; }
.stack { display: grid; gap: 16px; align-content: start; grid-template-columns: minmax(0, 1fr); }
.cols { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 1150px) { .cols.two { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
                             .cols.halves { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
                             .cols.detail { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); } }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 500;
        background: var(--line-2); color: var(--ink-2); white-space: nowrap; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); } .pill.info { background: var(--info-bg); color: var(--info); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 6px; font-size: 12px; font-weight: 500;
        border: 1px solid; white-space: nowrap; line-height: 18px; }
.role { display: inline-block; padding: 0 7px; border-radius: 5px; font-size: 11.5px; font-weight: 600; background: var(--line-2);
        color: var(--ink-2); line-height: 18px; white-space: nowrap; }
.muted { color: var(--muted); } .small { font-size: 12px; } .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* a table's box scrolls both ways; a long table's box is at most the window's height, so its header stays in view and
   its sideways scrollbar is on screen, not under its last row; a shadow marks the side where columns are out of view */
.tablebox { overflow: auto; scrollbar-width: thin; scrollbar-color: var(--muted) transparent;
  background: linear-gradient(to right, var(--panel) 30%, transparent) left / 40px 100% no-repeat local,
              linear-gradient(to left, var(--panel) 30%, transparent) right / 40px 100% no-repeat local,
              radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.45), transparent) left / 16px 100% no-repeat scroll,
              radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.45), transparent) right / 16px 100% no-repeat scroll; }
.tablebox.tall { max-height: calc(100vh - 230px); }
.tablebox::-webkit-scrollbar { height: 10px; width: 10px; }
.tablebox::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 5px; border: 2px solid var(--panel); }
table.t { width: 100%; border-collapse: collapse; }
table.t th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em;
             padding: 8px 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1;
             line-height: 1.25; vertical-align: bottom; }
table.t td { padding: 7px 10px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--panel-2); }
table.t td.subject .ellipsis { max-width: clamp(180px, 32vw, 560px); }
@media (max-width: 1250px) { table.t td, table.t th { padding-left: 7px; padding-right: 7px; } }
.empty { padding: 18px 16px; color: var(--muted); }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }
.tile { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 9px 12px; }
.tile .k { font-size: 11.5px; color: var(--muted); }
.tile .v { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.3; }
.tile .v.small { font-size: 14px; font-weight: 600; }
.tile.warn .v { color: var(--warn); } .tile.bad .v { color: var(--bad); } .tile.ok .v { color: var(--ok); }

.meter { display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; align-items: center; margin: 8px 0; }
.meter .track { height: 8px; background: var(--line-2); border-radius: 4px; overflow: hidden; }
.meter .fill { height: 100%; background: var(--accent); border-radius: 4px; }
.meter .fill.warn { background: var(--warn); } .meter .fill.bad { background: var(--bad); }
.meter .label { font-size: 13px; color: var(--ink-2); } .meter .val { font-size: 13px; font-variant-numeric: tabular-nums; }

.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 16px; font-size: 13px; }
.kv > .k { color: var(--muted); } .kv > .v { min-width: 0; overflow-wrap: anywhere; }

pre.box { background: var(--code); border: 1px solid var(--line-2); border-radius: 6px; padding: 10px 12px; margin: 6px 0;
          white-space: pre-wrap; word-break: break-word; font-size: 12px; line-height: 1.45; max-height: 520px; overflow: auto; }
pre.box.tall { max-height: 78vh; }

/* attention */
.attn { display: grid; gap: 8px; }
.attn .item { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: start; padding: 9px 12px; border-radius: 8px;
              border: 1px solid; font-size: 13px; }
.attn .item.bad { background: var(--bad-bg); border-color: transparent; color: var(--ink); }
.attn .item.warn { background: var(--warn-bg); border-color: transparent; }
.attn .item.info { background: var(--info-bg); border-color: transparent; }
.attn .icon { font-weight: 700; text-align: center; }
.attn .item.bad .icon { color: var(--bad); } .attn .item.warn .icon { color: var(--warn); } .attn .item.info .icon { color: var(--info); }
.allgood { display: flex; gap: 10px; align-items: center; color: var(--ok); padding: 4px 0; font-weight: 500; }

/* pipeline */
.pipe { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; align-items: stretch; }
.lane { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 8px; min-height: 90px; display: flex; flex-direction: column;
        flex: 1 1 180px; min-width: 165px; }
.lane.none { flex: 0 0 104px; min-width: 104px; opacity: .7; }
.lane.none .lh { white-space: normal; line-height: 1.25; }
.lane .lh { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line-2); font-size: 12.5px; font-weight: 600; }
.lane .lh .n { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; }
.lane .cards { padding: 6px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; max-height: 330px; overflow-y: auto; overflow-x: hidden; }
.card { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid; border-radius: 6px; padding: 5px 8px; cursor: pointer; min-width: 0; }
.card:hover { border-color: var(--accent); }
.card .id { font-size: 11.5px; font-weight: 700; color: var(--ink-2); }
.card .s { font-size: 12.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .st { font-size: 11.5px; color: var(--muted); }

/* held up */
.held { display: grid; gap: 6px; }
.hrow { display: grid; grid-template-columns: minmax(0, 5fr) 64px minmax(0, 7fr); gap: 12px; align-items: center; padding: 7px 10px;
        border: 1px solid var(--line-2); border-radius: 8px; background: var(--panel-2); }
.hroot { cursor: pointer; min-width: 0; } .hroot:hover b { color: var(--accent); }
.hroot .s { font-size: 12.5px; color: var(--ink-2); }
.hn { text-align: center; font-size: 18px; line-height: 1.1; } .hn .small { font-size: 11px; }
.hwait { display: flex; flex-wrap: wrap; gap: 4px; }
.tchip { font-size: 12px; padding: 1px 7px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel); color: var(--ink-2); white-space: nowrap; }
.tchip.direct { border-color: var(--g-waiting); color: var(--ink); font-weight: 600; }
.tchip:hover { border-color: var(--accent); text-decoration: none; }
@media (max-width: 700px) { .hrow { grid-template-columns: minmax(0, 1fr) 50px; } .hwait { grid-column: 1 / -1; } }

/* sessions now */
.live { display: grid; gap: 8px; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 9px 12px; border: 1px solid var(--line-2);
        border-radius: 8px; background: var(--panel-2); cursor: pointer; }
.srow:hover { border-color: var(--accent); }
.srow .who { display: flex; gap: 8px; align-items: center; min-width: 0; }
.srow .who b { white-space: nowrap; }
.srow .what { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-2); }
.srow .last { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.srow .last code { color: var(--ink-2); }
.srow .now { grid-column: 1 / -1; font-size: 12px; } .srow .now code { font-size: 11.5px; color: var(--ink-2); }
.tbar { display: inline-flex; height: 8px; gap: 1px; vertical-align: middle; }
.tbar > span { display: block; height: 100%; min-width: 1px; } .tbar > span:first-child { border-radius: 2px 0 0 2px; }
.tbar > span:last-child { border-radius: 0 2px 2px 0; } .tbar > span:only-child { border-radius: 2px; }
.tip { position: fixed; z-index: 30; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
       box-shadow: 0 4px 16px rgba(0,0,0,.18); padding: 7px 10px; font-size: 12px; line-height: 1.45; display: none; max-width: 360px; }
.tip b { font-weight: 650; } .tip .row { display: flex; gap: 8px; align-items: center; } .tip .row i { width: 10px; height: 3px; border-radius: 1px; }
.tip .row .val { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; padding-left: 12px; }
svg g[data-tip]:hover > :not(:first-child), svg rect[data-tip]:hover { opacity: .8; }
.cseg[data-tip]:hover, .tbar[data-tip]:hover { filter: brightness(1.1); }
.tline { position: relative; } .tline svg { display: block; width: 100%; height: 26px; }
.tline .axis { position: relative; height: 16px; font-size: 11px; color: var(--muted); }
.tline .axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; top: 2px; }
.tline .axis span.first { transform: none; } .tline .axis span.last { transform: translateX(-100%); }
.ctx { width: 110px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; }
.ctx > span { display: block; height: 100%; background: var(--accent); }

/* activity */
.feed { display: grid; }
.feed .ev { display: grid; grid-template-columns: 96px 12px minmax(0, 1fr); gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line-2);
            font-size: 13px; align-items: baseline; }
.feed .ev:last-child { border-bottom: 0; }
.feed .ev .when { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.feed .ev .mark { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; }

/* the conversation */
.turns { display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr); }
.turns > * { min-width: 0; }
.ended { display: grid; gap: 4px; margin-top: 4px; }
.ended .srow { background: none; }
svg .edge.hl { stroke: var(--accent) !important; stroke-width: 2.5px; stroke-dasharray: none; }
svg.focus .edge:not(.hl) { opacity: .15; }
svg.focus .node:not(.hl) { opacity: .45; }
.loglines .l.quiet { color: var(--muted); }
.msg { border: 1px solid var(--line-2); border-left: 3px solid var(--accent); border-radius: 6px; background: var(--panel-2); }
.msg > summary, .req > summary { list-style: none; cursor: pointer; padding: 7px 12px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.msg > summary::-webkit-details-marker, .req > summary::-webkit-details-marker { display: none; }
.msg .inner, .req .inner { padding: 0 12px 10px; }
.req { border: 1px solid var(--line-2); border-radius: 6px; background: var(--panel); }
.req.joinable { border-left: 3px solid var(--warn); }
.req.refused { border-left: 3px solid var(--bad); }
.req .n { font-weight: 700; font-size: 12.5px; min-width: 40px; }
.req .cmdline { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--ink-2); min-width: 0; flex: 1 1 380px;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.req .meta { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.call { border-top: 1px solid var(--line-2); padding-top: 8px; margin-top: 8px; }
.call .ch { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; }
.call .refusal { background: var(--bad-bg); color: var(--ink); border-radius: 6px; padding: 7px 10px; margin: 6px 0; font-size: 12.5px; }
.call .note { color: var(--muted); font-size: 12px; margin: 3px 0; padding-left: 10px; border-left: 2px solid var(--line); }

/* forms */
input[type=text], input[type=number], input[type=search], textarea, select {
  background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font: inherit; font-size: 13px; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
button.b { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; font: inherit;
           font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
button.b:hover { border-color: var(--accent); }
button.b.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.b.danger { color: var(--bad); border-color: var(--bad); }
button.b.danger:hover { background: var(--bad); color: #fff; }
button.b.small { padding: 2px 9px; font-size: 12px; }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { background: var(--panel); border: 0; border-right: 1px solid var(--line); padding: 5px 11px; font: inherit; font-size: 12.5px;
              color: var(--ink-2); cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.tabset { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 10px; flex-wrap: wrap; }
.tabset button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 10px; font: inherit; font-size: 13px;
                 color: var(--muted); cursor: pointer; }
.tabset button.on { color: var(--ink); border-bottom-color: var(--accent); }
.switch { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 10px 0; border-bottom: 1px solid var(--line-2); }
.switch:last-child { border-bottom: 0; }
.switch .name { font-weight: 600; font-size: 13.5px; }
.switch .desc { color: var(--muted); font-size: 12.5px; grid-column: 1; }
.switch .ctl { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 6px; align-items: center; }
.toggle { position: relative; width: 38px; height: 22px; border-radius: 11px; background: var(--line); border: 0; cursor: pointer; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff;
                 transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.toggle.on { background: var(--ok); } .toggle.on::after { left: 19px; }

// the bases' layers built by the owner: one base's (base.sh WHO layer), or every one, one after another
function buildAllLayers(order) {
  act("build", {part: "layers"}, `Build every layer now, one after another: ${order.join(", then ")}?\n\nEach is base.sh WHO layer: its stable base loaded again first if it is cold or its list names another, the reference reasoning and the named parts built, the chain recorded. One after another, since the builds share the indexes they regenerate.`);
}
function buildOneLayer(who) {
  act("build", {part: "layer", who}, `Build the ${who} layer now (base.sh ${who} layer)?\n\nIts stable base is loaded again first if it is cold or its list names another; then the reference reasoning and the named parts are built and the chain recorded.`);
}
function buildsPanel(d) {

    : el("span", {class: "warn"}, "the stable base and one medium layer", el("div", {class: "muted small"}, "the layout before the named parts: its next build makes the chain"));

    d.bases.filter(b => (d.chain.order || []).includes(b.who)).map((b, i) => [i ? " · " : "", el("b", {}, b.who), " " + (b.status || "—")])) : null;
  return panel("Bases and layers", "a layer's build: base.sh WHO layer — the stable base loaded again first if it is cold or its list names another, the reference reasoning and the named parts built, the chain recorded"
      + (d.daemon ? "" : " · the daemon is not running: what is built goes cold an hour after its last read unless the run starts"),
    el("div", {}, chainLine, table([
      {label: "Base", get: b => el("b", {}, b.who)},
      {label: "It stands as", get: layout},
      {label: "Sealed", get: b => b.sealed ? el("span", {}, clock(L(b.sealed)), el("div", {class: "muted small"}, ago(L(b.sealed)))) : "—"},
      {label: "Entry", get: b => el("span", {class: "pill " + (b.warm ? "ok" : "")}, el("span", {class: "dot"}), b.warm ? "warm" : "cold")},
      {label: "From scratch", num: 1, get: b => b.projected ? k(b.projected) : "—"},
      {label: "", get: b => b.status === "building" ? el("span", {class: "ok small"}, "building…")
        : b.status === "waiting its turn" ? el("span", {class: "muted small"}, "waiting its turn")
        : el("button", {class: "b small", onclick: () => buildOneLayer(b.who)}, "Build its layer")}], d.bases, null, "No base stands: base.sh WHO build, status, seal."),
      d.log.length ? el("details", {"data-key": "build-log", open: running || null, style: "margin-top:10px"}, el("summary", {class: "small muted", style: "cursor:pointer"}, "what the builds said (state/warm.log), newest first"),
        el("div", {class: "loglines"}, d.log.slice().reverse().slice(0, 16).map(l => el("div", {class: "l" + (/ATTENTION|fail|refused|MISS/i.test(l) ? " attention" : /sealed|OK|built/.test(l) ? " good" : "")},
          el("span", {class: "when"}, l.slice(11, 19)), el("span", {}, l.slice(20)))))) : null),
    [el("button", {class: "b small primary", disabled: running || null, onclick: () => buildAllLayers(order)}, running ? "building every layer…" : "Build every layer")], true);

function setOrder(o) {

  const now = o.queue.map(t => t.id), leave = now.filter(x => !ids.includes(x)), come = ids.filter(x => !now.includes(x));
  if (!ids.length) { toast("An empty order is none: drop tasks, or take one out of the queue from its page."); return; }
  const drop = document.getElementById("dropunnamed").checked;
  act("queue", {ids, drop_unnamed: drop}, `Queue these ${ids.length} task(s) first, in this order?`
    + (leave.length ? (drop ? `\n\nThese ${leave.length} leave the queue (they stay in the task list): ${leave.map(x => "#" + x).join(" ")}`
                            : `\n\nThese ${leave.length}, not named, stay queued after them: ${leave.map(x => "#" + x).join(" ")}`) : "")
    + (come.length ? `\n\nThese come into it: ${come.map(x => "#" + x).join(" ")}` : ""));
}
function queuePanel(o) {
  return panel("The queue", `${o.queue.length} task(s), in the order the dispatch starts them as they become ready · a move sets the whole order again`,
    table([{label: "#", num: 1, get: t => o.queue.indexOf(t) + 1},

        el("button", {class: "b small", title: "out of the queue (it stays in the list)", onclick: e => { e.stopPropagation(); placeTask(t.id, "out", `Take task ${t.id} out of the queue? It stays in the task list.`); }}, "out"))}],
      o.queue, t => go("tasks", t.id), "Nothing is queued.", null, 12), null, true);

// ---------------------------------------------------------------- the loop
async function followSource() {
  try {
    const v = await api("/api/version");
    const key = v.started + ":" + v.page;
    if (state.version !== null && state.version !== key) { location.reload(); return true; }
    state.version = key;
  } catch (e) {}
  return false;
}
const RENDER = {now: viewNow, graph: viewGraph, machine: viewMachine, bases: viewBases, trains: viewTrains, sessions: viewSessions, tasks: viewTasks, costs: viewCosts, log: viewLog, control: viewControl};
const SCROLLERS = ".tablebox, .graphbox, pre.box, .lane .cards";
// what each view reads beside the shared data, asked for at once with it
const PREFETCH = {
  now: () => [["/api/sessions"]],
  graph: () => graphHours === 6 ? [] : [["/api/graph", {hours: graphHours}]],
  trains: () => [["/api/checks"]],
  sessions: sub => sub ? [["/api/session", {name: sub}]] : [["/api/sessions", sessionFilter.archive ? {all: 1} : {}]],
  tasks: sub => sub ? [["/api/task", {id: sub}], ["/api/graph", {hours: 48}]] : [["/api/tasks"], ["/api/graph", {hours: 24}]],
  log: () => [["/api/log", {n: 1500}]],
  bases: () => [["/api/bases"]],
  costs: () => [["/api/costs", {hours: costHours}]],
  control: () => [["/api/builds"]]};
// a refresh by the timer waits while the owner reads: paused, or text selected (a new page would drop the selection)
const selecting = () => { try { return String(window.getSelection() || "").length > 0; } catch (e) { return false; } };
function later(ms) { clearTimeout(state.timer); state.timer = setTimeout(() => (state.paused || selecting()) ? later(5000) : refresh(), ms); }
async function refresh() {
  const seq = ++state.seq;  // a later refresh (a click, the timer) supersedes this one
  const [v, rawSub] = location.hash.slice(1).split("/");
  const view = RENDER[v] ? v : "now", sub = rawSub && decodeURIComponent(rawSub);
  inflight = new Map();
  const changed = followSource();
  const shared = Promise.all([api("/api/overview"), api("/api/machine"), api("/api/graph", {hours: 6}), api("/api/log", {n: 800})]);
  (PREFETCH[view] ? PREFETCH[view](sub) : []).forEach(([p, q]) => api(p, q).catch(() => {}));  // its own, meanwhile
  const next = el("main", {id: "main"});
  try {
    // what every view shows around it (the header, the attention count) is read once a refresh
    const [o, mach, g, log] = await shared;
    if (await changed) return;
    if (seq !== state.seq) return;
    if (o.noise) NOISE = new RegExp(o.noise);
    if (o.ceiling) CONTEXT_MAX = o.ceiling;
    const items = attentionItems(o);
    state.attention = items.filter(i => i[0] !== "info").length;
    state.readAt = Date.now(); state.failed = false;
    pills(o, mach, log); renderNav(view);
    await RENDER[view](next, sub, {o, mach, g, log, items});
  } catch (e) {
    renderNav(view); next.append(panel("Could not read the run", null, pre(String(e && e.stack || e))));
    if (!state.failed) { state.failed = true; document.getElementById("pills").prepend(el("span", {class: "pill bad"}, el("span", {class: "dot"}), "Console unreachable")); }
  }
  if (seq !== state.seq) return;
  // what the owner opened, closed or scrolled on this view is kept through the refresh: each details by its key, each
  // scrolling box (a table, the graph, a text, a lane) by its place in the page
  const same = state.shown === location.hash;
  const focus = document.activeElement && document.activeElement.id, caret = focus && document.activeElement.selectionStart;
  const opened = same ? new Map([...document.querySelectorAll("details[data-key]")].map(d => [d.dataset.key, d.open])) : new Map();
  const scrolled = same ? [...document.querySelectorAll(SCROLLERS)].map(e => [e.scrollTop, e.scrollLeft]) : [];
  next.querySelectorAll("details[data-key]").forEach(d => { if (opened.has(d.dataset.key)) d.open = opened.get(d.dataset.key); });
  const y = window.scrollY;
  document.getElementById("main").replaceWith(next);
  document.querySelectorAll(SCROLLERS).forEach((e, i) => { if (scrolled[i]) { e.scrollTop = scrolled[i][0]; e.scrollLeft = scrolled[i][1]; } });
  state.shown = location.hash;
  if (focus && document.getElementById(focus)) { const f = document.getElementById(focus); f.focus(); try { f.setSelectionRange(caret, caret); } catch (e) {} }
  window.scrollTo(0, y);
  const reading = (view === "sessions" || view === "tasks") && sub;
  later(view === "control" ? 15000 : reading || view === "costs" ? 30000 : view === "graph" ? 15000 : 6000);
}
// one tooltip for every chart: a mark's data-tip, its first line the heading; a line "label TAB value TAB colour" is a
// row with its colour's key and its value to the right
window.addEventListener("pointermove", e => {
  const box = document.getElementById("tip"), t = e.target && e.target.closest ? e.target.closest("[data-tip]") : null;
  if (!t) { box.style.display = "none"; return; }
  const [head, ...rest] = t.getAttribute("data-tip").split("\n");
  box.replaceChildren(el("b", {}, head), ...rest.map(r => { const [label, value, color] = r.split("\t");
    return value === undefined ? el("div", {}, r) : el("div", {class: "row"}, el("i", {style: color ? `background:${color}` : "background:transparent"}), el("span", {}, label), el("span", {class: "val"}, value)); }));
  box.style.display = "block";
  const w = box.offsetWidth, h = box.offsetHeight;
  box.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, e.clientX + 14)) + "px";
  box.style.top = (e.clientY + 18 + h > window.innerHeight ? e.clientY - h - 10 : e.clientY + 18) + "px";
});
// the keyboard: 1–9 and 0 open the views in the order of the tabs, / goes to the jump box, Escape leaves a field
window.addEventListener("keydown", e => {
  const t = e.target || {}, typing = /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName || "");
  if (typing) { if (e.key === "Escape" && t.blur) t.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); document.getElementById("jump").focus(); return; }
  if (/^[0-9]$/.test(e.key)) { const v = VIEWS.filter(Boolean)[e.key === "0" ? 9 : Number(e.key) - 1]; if (v) go(v[0]); }
});
// the jump box: a number (or #number) opens the task, anything else the session of that name
function jump(text) {
  const v = String(text || "").trim();
  if (!v) return;
  if (/^#?\d+$/.test(v)) go("tasks", v.replace("#", "")); else go("sessions", v);
  const box = document.getElementById("jump"); box.value = ""; box.blur();
}
const jumpBox = document.getElementById("jump");
jumpBox.addEventListener("keydown", e => { if (e.key === "Enter") jump(e.target.value); });
jumpBox.addEventListener("input", e => { if (e.inputType === "insertReplacementText" || e.inputType === undefined) jump(e.target.value); });  // picked from the list
jumpBox.addEventListener("focus", () => api("/api/sessions").then(rows => document.getElementById("jumplist").replaceChildren(
  ...rows.map(s => el("option", {value: s.name}, `${s.role}${s.task ? " · #" + s.task : ""} · ${s.state}`)))).catch(() => {}));
document.getElementById("pause").addEventListener("click", () => { state.paused = !state.paused; updatedLine(); if (!state.paused) refresh(); });
window.addEventListener("hashchange", () => {
  // the click is shown at once: its tab, and the page dimmed until its view is read
  const v = location.hash.slice(1).split("/")[0];
  renderNav(RENDER[v] ? v : "now");
  document.getElementById("main").classList.add("loading");
  window.scrollTo(0, 0);
  refresh();
});
refresh();
</script>
